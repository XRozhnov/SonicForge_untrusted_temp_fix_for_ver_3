name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack SonicForge.zip
        run: unzip -q SonicForge.zip && ls SonicForge
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Android SDK packages (the runner already ships the SDK)
        run: |
          SDKM=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7, cache-disabled: true }
      - name: Fetch emulator core (build time only)
        working-directory: SonicForge
        run: bash fetch_core.sh
      - name: Fetch Ruffle for Flash support (optional)
        working-directory: SonicForge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fetch_extras.sh
      - name: Build
        working-directory: SonicForge
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show errors on the run summary page
        if: failure()
        working-directory: SonicForge
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|FAILURE' -A2 build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: SonicForge/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: SonicForge-APK
          path: SonicForge/app/build/outputs/apk/debug/*.apk
